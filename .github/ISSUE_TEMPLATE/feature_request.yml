name: Feature request
description: Propose an application-neutral Bridge improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What operator or application-integration problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the CLI, manifest or architecture change you would like.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Platform scope
      options:
        - Cross-platform
        - Linux
        - Windows
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Architecture boundary
      description: Explain why this belongs in Bridge rather than an application repository.
    validations:
      required: true
