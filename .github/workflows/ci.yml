name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validate shell scripts
        run: bash -n install.sh bin/bridge deploy/pi/*.sh
      - name: Validate neutral core contract
        run: |
          docker compose --env-file .env.example config --quiet
          grep -q 'network_mode: host' compose.yml
          grep -Fq 'listen 127.0.0.1:${EDGE_PORT}' nginx/default.conf.template
          grep -Fq 'include /etc/nginx/routes/*.conf;' nginx/default.conf.template
          ! grep -R -E 'ALGOQUEST_|INTQWQ_DOMAIN|INTQWQ_ORIGIN|game\.intqwq\.com|www\.intqwq\.com' \
            compose.yml .env.example nginx bin deploy/pi README.md
      - name: Validate rendered empty Bridge edge
        run: |
          routes="$(mktemp -d)"
          trap 'rm -rf "${routes}"' EXIT
          docker run --rm \
            -e EDGE_PORT=18080 \
            -e 'NGINX_ENVSUBST_FILTER=^(EDGE_PORT)$' \
            -v "$PWD/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "${routes}:/etc/nginx/routes:ro" \
            nginx:1.27-alpine nginx -t
      - name: Exercise generic registration lifecycle
        run: |
          set -euo pipefail
          state_dir="$(mktemp -d)"
          manifest="$(mktemp)"
          origin_log="$(mktemp)"
          origin_pid=""
          cleanup() {
            [[ -z "${origin_pid}" ]] || kill "${origin_pid}" 2>/dev/null || true
            docker compose --env-file .env down --remove-orphans 2>/dev/null || true
            sudo rm -f /usr/local/sbin/bridge /etc/intqwq-bridge/config
            sudo rmdir /etc/intqwq-bridge 2>/dev/null || true
            sudo rm -rf "${state_dir}"
            rm -f .env "${manifest}" "${origin_log}"
          }
          trap cleanup EXIT

          cp .env.example .env
          sed -i "s|^BRIDGE_STATE_DIR=.*$|BRIDGE_STATE_DIR=${state_dir}|" .env
          sudo env \
            BRIDGE_OPERATOR_USER="${USER}" \
            BRIDGE_CLI_PATH=/usr/local/sbin/bridge \
            bash deploy/pi/install-cli.sh

          docker compose --env-file .env up -d --wait --wait-timeout 60
          python3 -m http.server 18091 --bind 127.0.0.1 >"${origin_log}" 2>&1 &
          origin_pid="$!"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18091/ >/dev/null && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:18091/ >/dev/null

          cat > "${manifest}" <<'JSON'
          {
            "version": 1,
            "service": "fixture",
            "routes": [{
              "hostname": "fixture.example.test",
              "origin": "http://127.0.0.1:18091",
              "health_path": "/"
            }]
          }
          JSON

          sudo bridge register "${manifest}" --no-dns
          sudo bridge list | grep -q 'fixture.example.test'
          curl -fsS -H 'Host: fixture.example.test' http://127.0.0.1:18080/ >/dev/null

          sudo bridge unregister fixture
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: fixture.example.test' http://127.0.0.1:18080/)" = 404
      - name: Validate generated systemd unit
        run: |
          cp .env.example .env
          state_dir="$(mktemp -d)"
          mkdir -p "${state_dir}/registry" "${state_dir}/nginx/routes"
          sed -i "s|^BRIDGE_STATE_DIR=.*$|BRIDGE_STATE_DIR=${state_dir}|" .env
          unit_dir="$(mktemp -d)"
          unit_file="${unit_dir}/bridge-edge.service"
          trap 'rm -f .env; sudo rm -rf "${unit_dir}" "${state_dir}"' EXIT
          sudo env BRIDGE_SYSTEMD_DRY_RUN=1 BRIDGE_SYSTEMD_UNIT_PATH="${unit_file}" \
            bash deploy/pi/install-systemd.sh
