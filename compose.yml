name: intqwq-bridge

services:
  edge:
    image: nginx:1.27-alpine
    environment:
      EDGE_PORT: "${EDGE_PORT:-18080}"
      NGINX_ENVSUBST_FILTER: "^(EDGE_PORT)$"
    # Host networking lets Bridge reach application origins that intentionally
    # bind only to 127.0.0.1. Nginx itself also binds only to host loopback.
    network_mode: host
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${BRIDGE_STATE_DIR:-/var/lib/intqwq-bridge}/nginx/routes:/etc/nginx/routes:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=4m
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${EDGE_PORT:-18080}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    stop_grace_period: 15s
